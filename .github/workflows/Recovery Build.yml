name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'Branch (e.g., 12.1, 11, 9.0)'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'Link to your 4-file repo'
        required: true
        default: 'https://github.com/TeamWin/android_device_asus_I003D'
      DEVICE_TREE_BRANCH:
        description: 'Branch of your tree'
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'Folder path (e.g., device/brand/name)'
        required: true
        default: 'device/asus/I003D'
      DEVICE_NAME:
        description: 'Device codename'
        required: true
        default: 'I003D'
      BUILD_TARGET:
        description: 'boot, recovery, or vendor_boot'
        required: true
        default: 'recovery'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Server
        run: |
            sudo apt update
            sudo apt -y install gperf gcc-multilib g++-multilib libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev liblz4-tool libncurses-dev libsdl1.2-dev libwxgtk3.2-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libtinfo6

      - name: Install Repo Tool
        run: |
            mkdir ~/bin
            curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
            chmod a+x ~/bin/repo
            sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Sync Source Code
        run: |
            mkdir workspace
            cd workspace
            git config --global user.name "Builder"
            git config --global user.email "builder@email.com"
            repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-${{ github.event.inputs.MANIFEST_BRANCH }}
            repo sync -j$(nproc --all) --force-sync

      - name: Clone Your Device Tree
        run: |
            cd workspace
            git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}

      - name: Build Recovery Image
        run: |
            cd workspace
            source build/envsetup.sh
            export ALLOW_MISSING_DEPENDENCIES=true
            lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng
            make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)

      - name: Upload Result
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          name: TWRP-Build-${{ github.event.inputs.DEVICE_NAME }}
          tag_name: ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
