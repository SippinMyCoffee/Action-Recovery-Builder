name: Recovery Build - Obsidian Baklava Modern

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        type: choice
        description: Manifest Branch
        options:
          - 15.1
          - 14.1
          - 12.1
        required: true
        default: 15.1
      DEVICE_TREE_URL:
        description: Device Tree URL
        required: true
        default: https://github.com/SippinMyCoffee/android_device_xiaomi_obsidian
      DEVICE_TREE_BRANCH:
        description: Device Tree Branch
        required: true
        default: main
      DEVICE_PATH:
        description: Path relative to source root
        required: true
        default: device/xiaomi/obsidian
      DEVICE_NAME:
        description: Device Name (e.g., obsidian)
        required: true
        default: obsidian
      BUILD_TARGET:
        type: choice
        description: Target Image
        options:
          - vendor_boot
          - boot
          - recovery
        required: true
        default: vendor_boot

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    steps:
    - name: Check Out
      uses: actions/checkout@v4
            
    - name: Cleanup & Maximize Storage
      uses: rokibhasansagar/slimhub_actions@main
      # This is the secret weapon to delete everything except the build tools

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Prepare Environment & Maximize Storage
      run: |
        # 1. Clear massive unused directories first
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
        
        # 2. Update and Install essential tools
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib g++-multilib libc6-dev lib32ncurses-dev \
        x11proto-core-dev libx11-dev tree lib32z1-dev libgl1-mesa-dev libxml2-utils \
        xsltproc bc ccache liblz4-tool libncurses-dev libsdl1.2-dev libxml2 lzop \
        pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma \
        ncftp qemu-user-static libtinfo5 python3 python3-pip python3-venv \
        python-is-python3 libssl-dev
        
        # 3. Setup bin and tools
        mkdir -p ~/bin
        curl https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/mkbootimg.py?format=TEXT | base64 --decode > ~/bin/mkbootimg
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/mkbootimg ~/bin/repo
        sudo ln -sf ~/bin/mkbootimg /usr/bin/mkbootimg
        sudo ln -sf ~/bin/repo /usr/bin/repo
      
    - name: Initialize repo
      run: |
        mkdir workspace && cd workspace
        # Bismillah - The Bleeding Edge: twrp-15 for Android 16 (Baklava) support
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-15 --depth=1
      
    - name: Repo Sync
      run: |
        cd workspace
        # Keeping it at -j2 for safety on this experimental branch
        repo sync -c -j2 --force-sync --no-clone-bundle --no-tags --current-branch --fail-fast
        
    - name: Clone device tree
      run: |
        git clone ${{ inputs.DEVICE_TREE_URL }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
      working-directory: workspace

    - name: Building recovery
      run: |
        cd workspace
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        # Use the variable to ensure lunch matches the input
        lunch omni_${{ inputs.DEVICE_NAME }}-eng
        make ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}*
        name: TWRP-${{ inputs.DEVICE_NAME }}-Baklava
        tag_name: ${{ github.run_id }}
        body: |
          Device: ${{ inputs.DEVICE_NAME }} (Helio G100 Ultra)
          Target: ${{ inputs.BUILD_TARGET }}
          Kernel: 6.12.30 GKI
          Manifest: ${{ inputs.MANIFEST_BRANCH }} (Android 16 Ready)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
